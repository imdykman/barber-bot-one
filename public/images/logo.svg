<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Градиент фона (Глубокий графитово-черный) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1f242d" />
      <stop offset="100%" stop-color="#0d1013" />
    </radialGradient>
    
    <!-- Неоновый золотой градиент для инструментов -->
    <linearGradient id="goldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#f5b041" />
      <stop offset="100%" stop-color="#dc7633" />
    </linearGradient>

    <!-- Свечение (Glow effect) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Круглый фон под аватарку мессенджера -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Внешнее неоновое кольцо -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldNeon)" stroke-width="4" opacity="0.4" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldNeon)" stroke-width="2" opacity="0.8" />

  <!-- Композиция инструментов -->
  <g filter="url(#neonGlow)" transform="translate(0, -10)">
    <!-- Расческа (Вертикально по центру) -->
    <path d="M 240 120 
             L 272 120 
             L 272 380 
             L 240 380 Z" fill="url(#goldNeon)" opacity="0.9" />
    <!-- Зубья расчески (Левая сторона) -->
    <path d="M 240 140 H 210 V 146 H 240
             M 240 160 H 210 V 166 H 240
             M 240 180 H 210 V 186 H 240
             M 240 200 H 210 V 206 H 240
             M 240 220 H 210 V 226 H 240
             M 240 240 H 210 V 246 H 240
             M 240 260 H 210 V 266 H 240
             M 240 280 H 210 V 286 H 240
             M 240 300 H 210 V 306 H 240
             M 240 320 H 210 V 326 H 240
             M 240 340 H 210 V 346 H 240
             M 240 360 H 210 V 366 H 240" fill="url(#goldNeon)" />

    <!-- Ножницы (Раскрытые, на переднем плане) -->
    <g fill="none" stroke="url(#goldNeon)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Левое лезвие и правое кольцо -->
      <path d="M 160 390 C 140 410, 140 440, 160 460 C 180 480, 210 480, 230 460 C 240 450, 245 435, 245 420 L 256 310 L 320 150" stroke-width="12" />
      <circle cx="195" cy="425" r="18" stroke-width="8" />
      
      <!-- Правое лезвие и левое кольцо -->
      <path d="M 352 390 C 372 410, 372 440, 352 460 C 332 480, 302 480, 282 460 C 272 450, 267 435, 267 420 L 256 310 L 192 150" stroke-width="12" />
      <circle cx="317" cy="425" r="18" stroke-width="8" />
      
      <!-- Центральный болт ножниц -->
      <circle cx="256" cy="310" r="7" fill="#1f242d" stroke-width="4" />
    </g>
  </g>
</svg>
