<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <style>
    .google-text { font-family: 'Product Sans', 'Trebuchet MS', 'Arial Black', sans-serif; font-size: 38px; font-weight: bold; }
    .google-sub { font-family: 'Google Sans', 'Arial', sans-serif; font-size: 13px; font-weight: 800; fill: #5F6368; letter-spacing: 9px; }
    
    /* Официальная палитра Google */
    .g-blue { fill: none; stroke: #4285F4; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    .g-red { fill: none; stroke: #EA4335; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    .g-yellow { fill: none; stroke: #FBBC05; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    .g-green { fill: none; stroke: #34A853; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Чистый белый фон (прозрачный при экспорте) -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Легкий фоновый круг, разбитый на 4 фирменных сектора -->
  <g transform="translate(250, 180)" opacity="0.12">
    <path d="M 0 0 L -90 -90 A 127 127 0 0 1 90 -90 Z" fill="#EA4335"/>
    <path d="M 0 0 L 90 -90 A 127 127 0 0 1 90 90 Z" fill="#4285F4"/>
    <path d="M 0 0 L 90 90 A 127 127 0 0 1 -90 90 Z" fill="#34A853"/>
    <path d="M 0 0 L -90 90 A 127 127 0 0 1 -90 -90 Z" fill="#FBBC05"/>
  </g>

  <!-- Графический знак: Ножницы-Единица -->
  <g id="google-barber-icon">
    <!-- Левое кольцо (Зеленое) -->
    <circle cx="205" cy="235" r="23" class="g-green"/>
    
    <!-- Правое кольцо (Желтое) -->
    <circle cx="295" cy="235" r="23" class="g-yellow"/>
    
    <!-- Левое лезвие (Синее) -->
    <path d="M 215 215 L 280 85" class="g-blue"/>
    
    <!-- Правое лезвие, переходящее в Единицу (Красное) -->
    <path d="M 285 215 L 220 85" class="g-red"/>
    <!-- Четкий загнутый носик Единицы -->
    <path d="M 221 86 L 196 100" class="g-red" stroke-width="11"/>
    
    <!-- Центральный соединительный болт -->
    <circle cx="250" cy="146" r="8" fill="#5F6368"/>
    <circle cx="250" cy="146" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Разноцветный текст Google-style -->
  <text x="250" y="375" text-anchor="middle" class="google-text">
    <tspan fill="#4285F4">Н</tspan>
    <tspan fill="#EA4335">о</tspan>
    <tspan fill="#FBBC05">ж</tspan>
    <tspan fill="#4285F4">н</tspan>
    <tspan fill="#34A853">и</tspan>
    <tspan fill="#EA4335">ц</tspan>
    <tspan fill="#FBBC05">ы</tspan>
    <tspan fill="#5F6368"> &amp; </tspan>
    <tspan fill="#4285F4">O</tspan>
    <tspan fill="#EA4335">n</tspan>
    <tspan fill="#FBBC05">e</tspan>
  </text>
  
  <!-- Строгая подпись снизу для баланса -->
  <text x="255" y="415" text-anchor="middle" class="google-sub">ПАРИКМАХЕРСКАЯ</text>
</svg>
