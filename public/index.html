<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Ножницы & One — Онлайн-запись</title>
    <link rel="icon" type="image/png" href="/images/logo1.png" />
    <link rel="apple-touch-icon" href="/images/logo1.png" />
    <style>
      :root {
        --primary: #1a73e8;
        --primary-hover: #1557b0;
        --success: #34a853;
        --error: #ea4335;
        --bg: #f8f9fa;
        --surface: #ffffff;
        --text: #202124;
        --text-secondary: #5f6368;
        --border: #dadce0;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family:
          'Google Sans',
          'Roboto',
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 16px;
        line-height: 1.5;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 24px;
      }
      .logo {
        max-width: 140px;
        height: auto;
        margin-bottom: 8px;
      }
      .subtitle {
        margin: 0;
        color: var(--text-secondary);
        font-size: 15px;
        font-weight: 500;
      }

      .step {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .step.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h2 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 16px;
      }

      .cards,
      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card,
      .list-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .card:hover,
      .list-item:hover {
        border-color: var(--primary);
        background: #e8f0fe;
      }
      .card img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        background: #e8eaed;
      }
      .card h3,
      .list-item h3 {
        margin: 0 0 4px 0;
        font-size: 16px;
        font-weight: 500;
      }
      .card p,
      .list-item p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
      }
      .price {
        font-weight: 600;
        color: var(--primary);
        font-size: 16px;
        margin-left: auto;
      }

      .dates {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .date-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        text-align: center;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
      }
      .date-item:hover {
        border-color: var(--primary);
        background: #e8f0fe;
        color: var(--primary);
      }

      .times {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .time-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        font-size: 15px;
        transition: all 0.2s;
      }
      .time-item:hover {
        border-color: var(--primary);
        background: #e8f0fe;
        color: var(--primary);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      input[type='text'],
      input[type='tel'] {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 16px;
        background: var(--surface);
      }
      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
      }

      .privacy-agreement {
        margin-top: 8px;
      }
      .checkbox-label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 14px;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .checkbox-label input {
        margin-top: 3px;
        accent-color: var(--primary);
        transform: scale(1.2);
      }
      .checkbox-label a {
        color: var(--primary);
        text-decoration: none;
      }

      .submit-btn {
        width: 100%;
        padding: 16px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 24px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 8px;
      }
      .submit-btn:hover {
        background: var(--primary-hover);
      }
      .submit-btn:disabled {
        background: var(--border);
        color: var(--text-secondary);
        cursor: not-allowed;
      }

      .back-btn {
        width: 100%;
        padding: 14px;
        background: transparent;
        color: var(--primary);
        border: none;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 16px;
      }
      .back-btn:hover {
        background: #e8f0fe;
        border-radius: 8px;
      }

      .error-message {
        color: var(--error);
        font-size: 13px;
        margin-top: -8px;
      }

      .home-btn {
        display: block;
        width: 100%;
        padding: 16px;
        background: var(--success);
        color: white;
        text-align: center;
        border-radius: 24px;
        text-decoration: none;
        font-weight: 500;
        margin-top: 24px;
      }

      footer {
        text-align: center;
        margin-top: 40px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      footer a {
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <a href="/" class="logo-link" style="text-decoration: none; color: inherit">
          <!-- Логотип теперь единственный заголовок -->
          <img
            src="/images/logo.svg"
            alt="Ножницы & One"
            class="logo"
            onerror="this.src = '/images/logo.png'"
          />
        </a>
        <p id="header-subtitle" class="subtitle">Салон красоты в Екатеринбурге</p>
      </header>

      <main>
        <!-- Шаг 1: Выбор мастера -->
        <div id="step-master" class="step active">
          <h2>Выберите мастера</h2>
          <div id="masters-list" class="cards"></div>
        </div>

        <!-- Шаг 2: Выбор услуги -->
        <div id="step-service" class="step">
          <h2>Выберите услугу</h2>
          <div id="services-list" class="list"></div>
          <button onclick="backToMaster()" class="back-btn">← Назад к мастерам</button>
        </div>

        <!-- Шаг 3: Выбор даты -->
        <div id="step-date" class="step">
          <h2>Выберите дату</h2>
          <div id="dates-list" class="dates"></div>
          <button onclick="backToService()" class="back-btn">← Назад к услугам</button>
        </div>

        <!-- Шаг 4: Выбор времени -->
        <div id="step-time" class="step">
          <h2>Выберите время</h2>
          <div id="times-list" class="times"></div>
          <button onclick="backToDate()" class="back-btn">← Назад к датам</button>
        </div>

        <!-- Шаг 5: Форма клиента -->
        <div id="step-form" class="step">
          <h2>Ваши данные</h2>
          <form id="booking-form">
            <input
              type="text"
              id="client-name"
              placeholder="Ваше имя"
              required
              autocomplete="name"
            />

            <input
              type="tel"
              id="client-phone"
              placeholder="+7 (___) ___-__-__"
              required
              maxlength="18"
              autocomplete="tel"
            />
            <div id="phone-error" class="error-message" style="display: none"></div>

            <div class="privacy-agreement">
              <label class="checkbox-label">
                <input type="checkbox" id="privacy-agreed" required />
                <span>
                  Я согласен с <a href="/privacy" target="_blank">политикой конфиденциальности</a>
                </span>
              </label>
              <div id="privacy-error" class="error-message" style="display: none"></div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Записаться</button>
          </form>
          <button onclick="backToTime()" class="back-btn">← Назад ко времени</button>
        </div>

        <!-- Шаг 6: Подтверждение -->
        <div id="step-success" class="step" style="text-align: center">
          <h2 style="color: var(--success); font-size: 24px">✅ Запись подтверждена!</h2>
          <div id="booking-details" style="margin: 24px 0; color: var(--text-secondary)"></div>
          <a href="/" class="home-btn">🏠 На главную</a>
        </div>
      </main>

      <footer>
        <p><a href="/privacy" target="_blank">Политика конфиденциальности</a></p>
      </footer>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
